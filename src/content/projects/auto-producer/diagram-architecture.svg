<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="Segoe UI, Inter, system-ui, sans-serif">
  <defs>
    <pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#26282d" stroke-width="1"/></pattern>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 10 5 0 9z" fill="#8a94a6"/></marker>
  </defs>
  <rect width="1000" height="540" fill="#1b1c20"/>
  <rect width="1000" height="540" fill="url(#g)"/>

  <g font-size="11" font-family="Consolas, ui-monospace, monospace" fill="#6f7580" letter-spacing="1.5">
    <text x="40" y="44">INPUTS</text>
    <text x="370" y="44">ENGINE</text>
    <text x="740" y="44">OUTPUTS</text>
  </g>

  <!-- inputs -->
  <g fill="#202125" stroke="#3b3e45" stroke-width="1.5">
    <rect x="40" y="64" width="240" height="96" rx="6"/>
    <rect x="40" y="186" width="240" height="72" rx="6"/>
    <rect x="40" y="284" width="240" height="72" rx="6"/>
  </g>
  <g fill="#e4e6ea" font-size="15" font-weight="600">
    <text x="58" y="92">Overhead camera</text>
    <text x="58" y="214">CamBot camera A</text>
    <text x="58" y="312">CamBot camera B</text>
  </g>
  <g fill="#9aa3b0" font-size="12.5">
    <text x="58" y="114">ArUco markers: robot poses</text>
    <text x="58" y="132">HSV-first ball detection</text>
    <text x="58" y="150">field corners, smoothed</text>
    <text x="58" y="236">its own ball detection</text>
    <text x="58" y="334">its own ball detection</text>
  </g>

  <!-- engine -->
  <rect x="370" y="64" width="300" height="420" rx="8" fill="#1e2530" stroke="#4a9bff" stroke-width="1.6"/>
  <text x="390" y="94" fill="#e4e6ea" font-size="16" font-weight="600">30 Hz tick loop</text>
  <text x="390" y="114" fill="#8fb8f0" font-size="12.5">one background thread, same order every tick</text>
  <g font-size="13" fill="#d3d7dd">
    <g fill="#4a9bff" font-family="Consolas, ui-monospace, monospace" font-size="12">
      <text x="392" y="148">1</text><text x="392" y="176">2</text><text x="392" y="204">3</text><text x="392" y="232">4</text><text x="392" y="260">5</text><text x="392" y="288">6</text><text x="392" y="316">7</text>
    </g>
    <text x="414" y="148">advance the simulation, if simulating</text>
    <text x="414" y="176">pull the latest vision reading</text>
    <text x="414" y="204">fold it into WorldState, emit events</text>
    <text x="414" y="232">Director: which camera is on air</text>
    <text x="414" y="260">aim the CamBot servos</text>
    <text x="414" y="288">run autonomy hooks</text>
    <text x="414" y="316">event rules: sounds, OBS filters</text>
  </g>
  <rect x="390" y="344" width="260" height="120" rx="6" fill="#202125" stroke="#3b3e45" stroke-width="1.5"/>
  <text x="406" y="370" fill="#e4e6ea" font-size="14" font-weight="600" font-family="Consolas, ui-monospace, monospace">WorldState</text>
  <g fill="#9aa3b0" font-size="12.5">
    <text x="406" y="392">robots, ball, goals, score</text>
    <text x="406" y="410">game state: idle, countdown, live, final</text>
    <text x="406" y="428">camera pan / tilt / zoom, recent events</text>
    <text x="406" y="450" fill="#6f7580">guarded by an RLock; GUI reads snapshot()</text>
  </g>

  <!-- outputs -->
  <g fill="#202125" stroke="#3b3e45" stroke-width="1.5">
    <rect x="740" y="64" width="220" height="96" rx="6"/>
    <rect x="740" y="186" width="220" height="96" rx="6"/>
    <rect x="740" y="308" width="220" height="96" rx="6"/>
  </g>
  <g fill="#e4e6ea" font-size="15" font-weight="600">
    <text x="758" y="92">CamBot servos</text>
    <text x="758" y="214">OBS Studio</text>
    <text x="758" y="336">Scoreboard overlay</text>
  </g>
  <g fill="#9aa3b0" font-size="12.5">
    <text x="758" y="114">ESP32-S3 + PCA9685</text>
    <text x="758" y="132" fill="#6f7580">USB serial</text>
    <text x="758" y="236">scene switches</text>
    <text x="758" y="254" fill="#6f7580">WebSocket v5 API</text>
    <text x="758" y="358">browser page OBS captures</text>
    <text x="758" y="376" fill="#6f7580">HTTP on 127.0.0.1:8899</text>
  </g>

  <!-- arrows -->
  <g stroke="#8a94a6" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M280 112 H366"/>
    <path d="M280 222 H366"/>
    <path d="M280 320 H366"/>
    <path d="M670 112 H736"/>
    <path d="M670 234 H736"/>
    <path d="M670 356 H736"/>
  </g>
  <text x="40" y="520" fill="#6f7580" font-size="12">Each CamBot aims from its own camera only. The overhead track drives game state, never the servos.</text>
</svg>
