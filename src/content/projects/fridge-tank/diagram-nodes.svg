    <path d="M1040 126 V180" marker-end="url(#a)"/>
    <path d="M1040 256 V310" marker-end="url(#a)"/>
    <path d="M1040 386 V420" marker-end="url(#a)"/>
  </g>
  <g fill="#6f7580" font-size="12">
    <text x="20" y="300">Both trackers publish the same topic</text>
    <text x="20" y="318">names the ArUco nodes used, so</text>
    <text x="20" y="336">nothing downstream had to change.</text>
  </g>
