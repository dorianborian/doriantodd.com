name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: sitemap and structured data use each page's last commit date

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache optimized images
        uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-assets-${{ hashFiles('src/content/**/*.png', 'src/content/**/*.jpg', 'src/content/**/*.jpeg', 'src/content/**/*.webp', 'src/assets/**') }}
          restore-keys: astro-assets-

      - run: npm run build

      - name: Verify links, assets and legacy URLs
        run: npm run check

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://www.doriantodd.com
    steps:
      - uses: actions/deploy-pages@v4

      # IndexNow: tells Bing (which powers ChatGPT search and Copilot), Yandex, Seznam and Naver what changed.
      - name: Notify search engines
        continue-on-error: true
        env:
          KEY: af658f9067c0de69b7aa73f808e53657
        run: |
          sleep 30
          urls=$(curl -s https://www.doriantodd.com/sitemap-0.xml | grep -o '<loc>[^<]*' | sed 's/<loc>//' | jq -R . | jq -s -c .)
          body=$(jq -n -c --arg key "$KEY" --argjson urls "$urls" '{host: "www.doriantodd.com", key: $key, keyLocation: ("https://www.doriantodd.com/" + $key + ".txt"), urlList: $urls}')
          curl -s -o /dev/null -w 'IndexNow %{http_code}\n' -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' -d "$body"
